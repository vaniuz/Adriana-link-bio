<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dra. Adriana Lima — Links</title>
<meta name="description" content="Dra. Adriana Lima (@dra.adrianalimadentista) — dentista, 1º Tenente do Exército e mentora de milhas. Seus gastos do mês já pagam a sua próxima viagem.">
<meta property="og:title" content="Dra. Adriana Lima — Links">
<meta property="og:description" content="Mentoria de Milhas e Estratégias de Viagens. Descubra quantas passagens o seu cartão está deixando de gerar.">
<meta property="og:image" content="assets/bio-adriana.jpg">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/bio-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ LINK-IN-BIO · DRA. ADRIANA LIMA (dark quente, estilo IG) ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#17100b;--card:rgba(255,255,255,.035);--line:rgba(255,255,255,.09);--ink:#f5efe6;--muted:#b3a695;--ouro:#d9a441;--ouro-ink:#1a1208}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh}
.wrap{max-width:428px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 18px calc(28px + env(safe-area-inset-bottom))}

/* ---- HERO ---- */
.hero{position:relative;height:min(56vh,460px);min-height:330px;margin:0 -18px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:44% 22%}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:46%;background:linear-gradient(to top,var(--bg) 2%,rgba(23,16,11,.55) 42%,transparent)}
.badge{position:absolute;top:calc(16px + env(safe-area-inset-top));left:18px;z-index:3;width:52px;height:52px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.badge img{width:100%;height:100%;object-fit:contain}
.name{position:absolute;left:0;right:0;bottom:10px;z-index:2;text-align:center}
.name h1{font-size:clamp(44px,14vw,58px);font-weight:800;letter-spacing:-.02em;line-height:.96;text-shadow:0 6px 40px rgba(0,0,0,.55)}

/* ---- INTRO ---- */
.welcome{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px auto 0;width:max-content;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:10px 30px;font-size:17px;font-weight:600}
.hint{margin:13px 0 12px;text-align:center;color:var(--muted);font-size:13px;letter-spacing:.02em}
.hint b{color:var(--ink)}

/* ---- CARDS ---- */
.cards{display:flex;flex-direction:column;gap:14px}
.card{position:relative;display:flex;align-items:stretch;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--card);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.card:active{transform:scale(.98)}
@media(hover:hover){.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2);box-shadow:0 18px 50px rgba(0,0,0,.5)}}
.card-body{padding:16px 6px 16px 18px;flex:1;min-width:0;position:relative;z-index:2}
.card-top{display:flex;align-items:center;gap:8px}
.ico{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ico-chat{background:rgba(217,164,65,.14);border:1px solid rgba(217,164,65,.45)}
.ico-note{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16)}
.card-top .tag{font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--muted);text-transform:uppercase}
.card h3{margin-top:9px;font-size:19px;line-height:1.22;font-weight:800;letter-spacing:-.01em}
.card h3 .ouro{color:var(--ouro)}
.card .micro{margin-top:5px;font-size:12.5px;color:var(--muted);line-height:1.4}
.cta{margin-top:12px;display:inline-flex;align-items:center;gap:7px;background:var(--ouro);color:var(--ouro-ink);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border-radius:9px;box-shadow:0 8px 24px rgba(217,164,65,.3)}
.cta svg{flex:0 0 auto}
.card-thumb{position:relative;width:42%;flex:0 0 auto;margin:7px;border-radius:14px;overflow:hidden;z-index:2}
.card-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.card-site::before{content:"";position:absolute;inset:-30%;z-index:0;background:url('assets/bio-adriana.jpg') center 22%/cover no-repeat;filter:blur(16px) saturate(.85) brightness(.5)}
.card-site .card-body>*{position:relative;z-index:2}
.card-site .card-body{flex:1.15}
.card-arrow{position:relative;z-index:2;flex:0 0 auto;display:flex;align-items:center;padding-right:16px;color:var(--muted)}
/* ---- RODAPÉ ---- */
.foot{margin-top:auto;padding-top:26px;text-align:center;color:#6b5f52;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.foot .word{color:var(--muted)}

/* ---- ENTRADA ---- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{animation:rise .7s var(--e,cubic-bezier(.22,1,.36,1)) both}
.welcome{animation:rise .6s .15s var(--e,cubic-bezier(.22,1,.36,1)) both}
.hint{animation:rise .6s .25s var(--e,cubic-bezier(.22,1,.36,1)) both}
.card:nth-child(1){animation:rise .6s .35s var(--e,cubic-bezier(.22,1,.36,1)) both}
.card:nth-child(2){animation:rise .6s .45s var(--e,cubic-bezier(.22,1,.36,1)) both}
.foot{animation:fade .6s .6s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.hero,.welcome,.hint,.card,.foot{animation:none}}
/* override genérico do hero name sobre gradiente */
.hero .name{animation:none}
@media(min-width:560px){.hero::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(120% 90% at 50% 0%,transparent 55%,rgba(23,16,11,.5))}}
</style>
</head>
<body>
<main class="wrap">

  <!-- HERO: foto + nome -->
  <header class="hero">
    <img src="assets/bio-adriana.jpg" alt="Dra. Adriana Lima sorrindo, sentada em poltrona de couro" width="1200" height="896">
    <div class="badge" aria-hidden="true"><img src="assets/bio-logo.png" alt=""></div>
    <div class="name">
      <h1>Dra. Adriana</h1>
    </div>
  </header>

  <!-- WELCOME -->
  <div class="welcome">Bem-vindo!</div>
  <p class="hint">Links úteis <b>👇</b></p>

  <!-- LINKS -->
  <nav class="cards" aria-label="Links da Dra. Adriana Lima">

    <!-- DIAGNÓSTICO / WHATSAPP -->
    <a class="card" href="https://wa.me/5534991660836?text=Oi%2C%20Dra.%20Adriana!%20Vim%20pelo%20Instagram%20e%20quero%20descobrir%20quantas%20viagens%20os%20meus%20gastos%20do%20m%C3%AAs%20j%C3%A1%20pagam." target="_blank" rel="noopener">
      <div class="card-body">

          <span class="tag">Grátis · Mentoria de Milhas</span>
        </div>
        <h3>Seus gastos do mês já pagam a sua <span class="ouro">próxima viagem!</span></h3>
        <span class="cta"><svg width="14" height="14" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M9.8 7.6 8.3 7a.7.7 0 0 0-.8.2l-.6.7A5.6 5.6 0 0 1 4.1 5l.7-.6c.2-.2.3-.5.2-.8L4.4 2.2a.7.7 0 0 0-.8-.5l-1.4.3c-.4.1-.6.4-.6.8.2 4 3.5 7.3 7.6 7.6.4 0 .7-.2.8-.6l.3-1.4a.7.7 0 0 0-.5-.8Z" fill="#1a1208"/></svg>WhatsApp</span>
      </div>
      <div class="card-thumb"><img src="assets/bio-thumb.jpg" alt="Dra. Adriana Lima, mentora de milhas"></div>
    </a>

    <!-- MENTORIA -->
    <a class="card card-site" href="https://www.instagram.com/dra.adrianalimadentista/" target="_blank" rel="noopener">
      <div class="card-body">
        <div class="card-top">
          <span class="ico ico-note" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4.2 9.6c0 .9-.9 1.6-2 1.6S.3 10.5.3 9.6c0-.9.9-1.6 2-1.6.4 0 .8.1 1.1.3V1.6l8-.9v7.6c0 .9-.9 1.6-2 1.6s-2-.7-2-1.6.9-1.6 2-1.6c.4 0 .8.1 1.1.3V2.9L5.4 3.7v5.9Z" fill="#fff"/></svg></span>
          <span class="tag">Mentorias</span>
        </div>
        <h3><span>Mentorias de</span> <span class="ouro">Milhas</span></h3>
        <p class="micro">Cada conta paga vira milha — e cada milha vira assento, hotel e sala VIP.</p>
      </div>
      <span class="card-arrow" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M5.5 2.5 11 8l-5.5 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>

  </nav>

  <footer class="foot">© 2026 <span class="word">Dra. Adriana Lima</span></footer>

</main>
</body>
</html>
